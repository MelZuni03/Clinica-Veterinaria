<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{general/fragmentos :: head('Citas programadas')}"></head><body>
<div th:replace="~{general/fragmentos :: header}"></div><div th:replace="~{general/fragmentos :: navbar}"></div>
<main class="container py-5"><h2 class="section-title">Citas programadas</h2><p>Listado de consulta. Esta pantalla no permite editar ni eliminar citas.</p>
<div class="card p-3"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Mascota</th><th>Propietario</th><th>Fecha</th><th>Servicio</th></tr></thead><tbody>
<tr th:each="cita : ${citas}"><td class="fw-semibold" th:text="${cita.nombreMascota}"></td><td th:text="${cita.nombrePropietario}"></td><td th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}"></td><td th:text="${cita.servicio.nombre}"></td></tr>
<tr th:if="${#lists.isEmpty(citas)}"><td colspan="4" class="text-center text-muted py-4">No hay citas registradas.</td></tr>
</tbody></table></div></div></main><div th:replace="~{general/fragmentos :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
