<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | ' + #{app.nombre}">Veterinaria Huellitas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:fragment="header" class="site-header">
    <div class="container">
        <h1 class="h3 mb-1" th:text="#{header.titulo}">Veterinaria Huellitas</h1>
        <p class="mb-0" th:text="#{header.subtitulo}">Cuidamos a quienes llenan tu vida de alegría</p>
    </div>
</header>
<nav th:fragment="navbar" class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}" th:text="#{app.nombre}">Huellitas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}" th:text="#{nav.inicio}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tipos}" th:text="#{nav.tipos}">Tipos de servicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/servicios}" th:text="#{nav.servicios}">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/citas}" th:text="#{nav.citas}">Citas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/#contacto}" th:text="#{nav.contacto}">Contacto</a></li>
            </ul>
        </div>
    </div>
</nav>
<footer th:fragment="footer">
    <div class="container text-center"><span th:text="#{footer.texto}">Veterinaria Huellitas · Cuidando sus mejores momentos</span></div>
</footer>
</body>
</html>
