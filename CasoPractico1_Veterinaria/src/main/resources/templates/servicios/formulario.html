<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{general/fragmentos :: head('Formulario de servicio')}"></head><body>
<div th:replace="~{general/fragmentos :: header}"></div><div th:replace="~{general/fragmentos :: navbar}"></div>
<main class="container py-5"><div class="card p-4 mx-auto" style="max-width:720px"><h2 class="section-title" th:text="${titulo}">Servicio</h2>
<form method="post" th:action="@{/servicios/guardar}" th:object="${servicio}" class="mt-3">
<input type="hidden" th:field="*{id}">
<div class="mb-3"><label class="form-label">Nombre del servicio</label><input class="form-control" th:field="*{nombre}" required maxlength="100"><div class="text-danger small" th:errors="*{nombre}"></div></div>
<div class="mb-3"><label class="form-label">Tipo de servicio</label><select class="form-select" name="tipoId" required><option value="">Seleccione una categoría</option><option th:each="tipo : ${tipos}" th:value="${tipo.id}" th:text="${tipo.nombre}" th:selected="${servicio.tipoServicio != null and servicio.tipoServicio.id == tipo.id}"></option></select><div class="text-danger small" th:errors="*{tipoServicio}"></div></div>
<div class="row"><div class="col-md-6 mb-3"><label class="form-label">Precio en colones</label><input type="number" min="0.01" step="0.01" class="form-control" th:field="*{precio}" required><div class="text-danger small" th:errors="*{precio}"></div></div>
<div class="col-md-6 mb-3"><label class="form-label">Duración (minutos)</label><input type="number" min="1" class="form-control" th:field="*{duracionMinutos}" required><div class="text-danger small" th:errors="*{duracionMinutos}"></div></div></div>
<button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/servicios}">Cancelar</a>
</form></div></main><div th:replace="~{general/fragmentos :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
