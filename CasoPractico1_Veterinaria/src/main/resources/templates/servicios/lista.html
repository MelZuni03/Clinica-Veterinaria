<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{general/fragmentos :: head('Servicios')}"></head><body>
<div th:replace="~{general/fragmentos :: header}"></div><div th:replace="~{general/fragmentos :: navbar}"></div>
<main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="section-title">Servicios veterinarios</h2><p>Consulte precios, duración y categoría.</p></div><a class="btn btn-primary" th:href="@{/servicios/nuevo}">+ Agregar servicio</a></div>
<div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="card p-3"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Nombre</th><th>Tipo</th><th>Precio (₡)</th><th>Duración</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="servicio : ${servicios}"><td class="fw-semibold" th:text="${servicio.nombre}"></td><td th:text="${servicio.tipoServicio.nombre}"></td><td th:text="${#numbers.formatDecimal(servicio.precio, 1, 'COMMA', 2, 'POINT')}"></td><td th:text="${servicio.duracionMinutos + ' min'}"></td><td class="text-nowrap">
<a class="btn btn-sm btn-outline-primary" th:href="@{/servicios/editar/{id}(id=${servicio.id})}">Editar</a>
<button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:attr="data-bs-target='#eliminarServicio' + ${servicio.id}">Eliminar</button>
<div class="modal fade" th:id="'eliminarServicio' + ${servicio.id}" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirmar eliminación</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">¿Desea eliminar el servicio <strong th:text="${servicio.nombre}"></strong>?</div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><form method="post" th:action="@{/servicios/eliminar/{id}(id=${servicio.id})}"><button class="btn btn-danger">Sí, eliminar</button></form></div></div></div></div>
</td></tr><tr th:if="${#lists.isEmpty(servicios)}"><td colspan="5" class="text-center text-muted py-4">Todavía no hay servicios registrados.</td></tr>
</tbody></table></div></div></main><div th:replace="~{general/fragmentos :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
