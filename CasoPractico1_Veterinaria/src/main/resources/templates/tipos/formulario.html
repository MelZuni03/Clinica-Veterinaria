<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{general/fragmentos :: head('Formulario de tipo')}"></head><body>
<div th:replace="~{general/fragmentos :: header}"></div><div th:replace="~{general/fragmentos :: navbar}"></div>
<main class="container py-5"><div class="card p-4 mx-auto" style="max-width:720px"><h2 class="section-title" th:text="${titulo}">Tipo de servicio</h2>
<form method="post" th:action="@{/tipos/guardar}" th:object="${tipoServicio}" class="mt-3">
<input type="hidden" th:field="*{id}">
<div class="mb-3"><label class="form-label">Nombre</label><input class="form-control" th:field="*{nombre}" required maxlength="100"><div class="text-danger small" th:errors="*{nombre}"></div></div>
<div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" th:field="*{descripcion}" maxlength="255" rows="3"></textarea></div>
<button class="btn btn-primary">Guardar</button> <a class="btn btn-outline-secondary" th:href="@{/tipos}">Cancelar</a>
</form></div></main><div th:replace="~{general/fragmentos :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
