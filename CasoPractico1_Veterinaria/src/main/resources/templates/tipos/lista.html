<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: head('Tipos de servicio')}"></head><body>
<div th:replace="~{general/fragmentos :: header}"></div><div th:replace="~{general/fragmentos :: navbar}"></div>
<main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="section-title">Tipos de servicio</h2><p>Administre las categorías que agrupan los servicios.</p></div><a class="btn btn-primary" th:href="@{/tipos/nuevo}">+ Agregar tipo</a></div>
<div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div class="card p-3"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Nombre</th><th>Descripción</th><th>Servicios asociados</th><th>Acciones</th></tr></thead><tbody>
<tr th:each="tipo : ${tipos}"><td class="fw-semibold" th:text="${tipo.nombre}"></td><td th:text="${tipo.descripcion}"></td><td><span class="pill" th:text="${tipo.servicios.size()}"></span></td><td class="text-nowrap">
<a class="btn btn-sm btn-outline-primary" th:href="@{/tipos/editar/{id}(id=${tipo.id})}">Editar</a>
<button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:attr="data-bs-target='#eliminarTipo' + ${tipo.id}">Eliminar</button>
<div class="modal fade" th:id="'eliminarTipo' + ${tipo.id}" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Confirmar eliminación</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">¿Desea eliminar el tipo <strong th:text="${tipo.nombre}"></strong>? No se podrá eliminar si tiene servicios asociados.</div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><form method="post" th:action="@{/tipos/eliminar/{id}(id=${tipo.id})}"><button class="btn btn-danger">Sí, eliminar</button></form></div></div></div></div>
</td></tr><tr th:if="${#lists.isEmpty(tipos)}"><td colspan="4" class="text-center text-muted py-4">Todavía no hay tipos registrados.</td></tr>
</tbody></table></div></div></main><div th:replace="~{general/fragmentos :: footer}"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
